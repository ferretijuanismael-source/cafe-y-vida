<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Café y Vida</title><link rel="stylesheet" href="/styles.css"><style>.card{background:#fffaf4;border-radius:18px;padding:18px;box-shadow:0 7px 20px #5a3b2418;margin-bottom:16px}.card input,.card button{width:100%;padding:14px;border-radius:12px;border:1px solid #dcc7b1;font:inherit;box-sizing:border-box}.card button{margin-top:12px;background:#3f2a1e;color:#fff8ef;border:0;font-weight:700;cursor:pointer}.card label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}.hint{font-size:13px;opacity:.7}</style></head><body><main><header><div class="logo">☕</div><h1>Administración</h1><p>Desde aquí podés actualizar tu página.</p></header>
<form class="card" action="/admin/logo" method="post" enctype="multipart/form-data"><h2>🖼️ Cambiar logo</h2><label>Contraseña</label><input name="password" type="password" required><label>Nuevo logo</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp" required><p class="hint">Recomendado: PNG con fondo transparente.</p><button>Actualizar logo</button></form>
<form class="card" action="/admin/background" method="post" enctype="multipart/form-data"><h2>🌄 Cambiar fondo</h2><label>Contraseña</label><input name="password" type="password" required><label>Nueva imagen de fondo</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp" required><button>Cambiar fondo</button></form>
<form class="card" action="/admin/upload" method="post" enctype="multipart/form-data"><h2>📄 Presentación semanal</h2><label>Contraseña</label><input name="password" type="password" required><label>Nuevo PDF</label><input name="pdf" type="file" accept="application/pdf" required><button>Actualizar presentación</button></form>
</main></body></html>
