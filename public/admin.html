<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Café y Vida</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f3ece4!important}.admin{width:min(1180px,94%);padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 360px;gap:20px}.card{background:#fffaf4;border-radius:18px;padding:20px;box-shadow:0 7px 20px #5a3b2418;margin-bottom:16px}.card h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select,.card button{width:100%;padding:12px;border-radius:10px;border:1px solid #dcc7b1;font:inherit}.field textarea{min-height:70px;resize:vertical}.card button{margin-top:10px;background:#3f2a1e;color:#fff8ef;border:0;font-weight:700;cursor:pointer}.secondary{background:#eee2d6!important;color:#3f2a1e!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.linkrow{background:#f7eee6;border-radius:12px;padding:12px;margin:10px 0}.linkhead{display:flex;gap:8px;align-items:center}.drag{cursor:grab;font-size:20px}.linkrow input{margin-top:7px;width:100%;padding:9px;border:1px solid #dcc7b1;border-radius:8px}.link-actions{display:flex;gap:8px;margin-top:7px}.link-actions button{margin:0;padding:8px}.check{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:7px}.check input{width:auto}.preview{position:sticky;top:15px;height:max-content}.phone{background:#222;border-radius:28px;padding:10px;box-shadow:0 15px 35px #0002}.phone iframe{width:100%;height:650px;border:0;border-radius:20px;background:#ead9c6}.hint{font-size:13px;opacity:.7}.toast{display:none;padding:10px;background:#e6f4e8;border-radius:10px;margin-bottom:15px}.mini{font-size:12px;opacity:.65}@media(max-width:900px){.grid{grid-template-columns:1fr}.preview{position:static}.phone iframe{height:560px}}
</style></head><body><main class="admin"><div class="top"><div><h1>Administración</h1><p>Controlá tu página desde un solo lugar.</p></div><div style="display:flex;gap:12px;align-items:center"><a href="/" target="_blank">Ver página ↗</a><a href="/admin/logout">Cerrar sesión</a></div></div><div id="toast" class="toast">Cambios guardados correctamente.</div><div class="grid"><div>
<section class="card"><h2>📄 PDF</h2><p class="hint">Subí el PDF y listo. Se reemplazará el anterior.</p><form id="pdfForm" action="/admin/upload" method="post" enctype="multipart/form-data"><div class="field"><label>Nuevo PDF</label><input name="pdf" type="file" accept="application/pdf" required></div><button>Subir PDF</button></form><p id="pdfstatus" class="mini"></p></section>
<section class="card"><h2>🔗 Links</h2><p class="hint">Agregá, editá, ocultá o reordená tus enlaces.</p><div id="linklist"></div><button type="button" class="secondary" onclick="addLink()">＋ Agregar nuevo link</button><button type="button" onclick="saveLinks()">Guardar links</button></section>
<section class="card"><h2>🎨 Apariencia</h2><div class="row"><div class="field"><label>Color del título</label><input id="titleColor" type="color"></div><div class="field"><label>Color de la descripción</label><input id="descriptionColor" type="color"></div></div>
<div class="row"><div class="field"><label>Fondo de botones</label><input id="buttonColor" type="color"></div><div class="field"><label>Texto de botones</label><input id="buttonTextColor" type="color"></div></div><div class="row"><div class="field"><label>Transparencia de botones <span id="opacityVal"></span></label><input id="opacity" type="range" min="20" max="100"></div><div class="field"><label>Redondeado <span id="radiusVal"></span></label><input id="radius" type="range" min="0" max="40"></div></div><div class="row"><div class="field"><label>Tamaño del título</label><input id="titleSize" type="range" min="24" max="54"></div><div class="field"><label>Tamaño del texto</label><input id="bodySize" type="range" min="12" max="22"></div></div><div class="field"><label>Oscurecer fondo <span id="overlayVal"></span></label><input id="overlay" type="range" min="0" max="40"></div><div class="field"><label>Título</label><input id="siteTitle"></div><div class="field"><label>Descripción</label><textarea id="siteDescription"></textarea></div><div class="field"><label>Pie de página</label><input id="siteFooter"></div><button type="button" onclick="saveAppearance()">Guardar apariencia</button></section>
<section class="card"><h2>🖼️ Imágenes</h2><form action="/admin/logo" method="post" enctype="multipart/form-data"><div class="field"><label>Logo</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp" required></div><button>Actualizar logo</button></form><hr><form action="/admin/background" method="post" enctype="multipart/form-data"><div class="field"><label>Fondo</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp" required></div><button>Actualizar fondo</button></form></section>
</div><aside class="preview"><h3>Vista previa</h3><div class="phone"><iframe id="preview" src="/"></iframe></div></aside></div></main><script>
let data={links:[],appearance:{}};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function load(){data=await fetch('/api/config').then(r=>r.json());$('siteTitle').value=data.title;$('siteDescription').value=data.description;$('siteFooter').value=data.footer;const a=data.appearance||{};$('titleColor').value=a.titleColor||a.textColor||'#3f2a1e';$('descriptionColor').value=a.descriptionColor||a.textColor||'#3f2a1e';$('buttonColor').value=a.buttonColor||'#fffaf4';$('buttonTextColor').value=a.buttonTextColor||a.textColor||'#3f2a1e';$('opacity').value=a.buttonOpacity??92;$('radius').value=a.buttonRadius??16;$('titleSize').value=a.titleSize??36;$('bodySize').value=a.bodySize??15;$('overlay').value=a.overlay??12;updateLabels();renderLinks();$('pdfstatus').textContent=data.hasPdf?'✓ Hay un PDF publicado.':'No hay PDF publicado.';}
function updateLabels(){$('opacityVal').textContent=$('opacity').value+'%';$('radiusVal').textContent=$('radius').value+'px';$('overlayVal').textContent=$('overlay').value+'%';['opacity','radius','titleSize','bodySize','overlay','titleColor','descriptionColor','buttonColor','buttonTextColor'].forEach(id=>$(id).addEventListener('input',preview));}
function renderLinks(){const box=$('linklist');box.innerHTML=data.links.map((x,i)=>`<div class="linkrow" data-i="${i}"><div class="linkhead"><span class="drag">☰</span><strong>Link ${i+1}</strong><button type="button" class="secondary" onclick="removeLink(${i})">Eliminar</button></div><input class="lname" value="${esc(x.name)}" placeholder="Nombre"><input class="lurl" value="${esc(x.url)}" placeholder="https://..."><input class="ldesc" value="${esc(x.description||'')}" placeholder="Descripción opcional"><label class="check"><input class="lactive" type="checkbox" ${x.active?'checked':''}> Mostrar en la página</label><label class="check"><input class="lfeatured" type="checkbox" ${x.featured?'checked':''}> Destacar</label></div>`).join('')}
function addLink(){data.links.push({id:'new-'+Date.now(),name:'Nuevo link',url:'https://',description:'',active:true,featured:false});renderLinks()};function removeLink(i){data.links.splice(i,1);renderLinks()}
function collectLinks(){return [...document.querySelectorAll('.linkrow')].map((r,i)=>({id:data.links[i]?.id||'link-'+Date.now()+i,name:r.querySelector('.lname').value,url:r.querySelector('.lurl').value,description:r.querySelector('.ldesc').value,active:r.querySelector('.lactive').checked,featured:r.querySelector('.lfeatured').checked}))}
async function saveLinks(){const r=await fetch('/admin/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({links:collectLinks()})});if(!r.ok)return alert(await r.text());showToast();refresh()}
function appearance(){return {font:'DM Sans',titleFont:'Playfair Display',textColor:$('titleColor').value,titleColor:$('titleColor').value,descriptionColor:$('descriptionColor').value,buttonColor:$('buttonColor').value,buttonTextColor:$('buttonTextColor').value,buttonOpacity:+$('opacity').value,buttonRadius:+$('radius').value,titleSize:+$('titleSize').value,bodySize:+$('bodySize').value,overlay:+$('overlay').value}}
async function saveAppearance(){const r=await fetch('/admin/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('siteTitle').value,description:$('siteDescription').value,footer:$('siteFooter').value,appearance:appearance()})});if(!r.ok)return alert(await r.text());showToast();refresh()}
function preview(){updateLabels();const a=appearance();const frame=$('preview');frame.contentWindow.postMessage({type:'preview',title:$('siteTitle').value,description:$('siteDescription').value,footer:$('siteFooter').value,appearance:a},'*')}
function refresh(){frameReload();load()};function frameReload(){const f=$('preview');f.src='/';}function showToast(){$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
window.addEventListener('message',e=>{});$('pdfForm').addEventListener('submit',async e=>{
e.preventDefault();
const form=e.currentTarget,fileInput=form.querySelector('input[name="pdf"]'),file=fileInput&&fileInput.files&&fileInput.files[0];
if(!file)return alert('Seleccioná un PDF.');
if(!/\.pdf$/i.test(file.name))return alert('El archivo debe ser un PDF.');
const fd=new FormData();fd.append('pdf',file,file.name);
try{const r=await fetch('/admin/upload',{method:'POST',body:fd});if(!r.ok)return alert(await r.text());showToast();$('pdfstatus').textContent='✓ Presentación actualizada correctamente.';fileInput.value='';}catch(err){alert('No se pudo conectar con el servidor.');}
});
load();setTimeout(updateLabels,100);
</script></body></html>
