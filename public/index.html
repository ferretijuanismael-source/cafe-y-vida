<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café y Vida</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><div class="logo"><img src="/logo" onerror="this.style.display='none';this.parentElement.textContent='☕'" alt="Logo"></div><h1 id="title">Café y Vida</h1><p id="description"></p></header><section class="links" id="links"></section><footer id="footer"></footer></main><script>
const hexToRgb=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
fetch('/api/config').then(r=>r.json()).then(d=>{document.title=d.title;title.textContent=d.title;description.textContent=d.description;footer.textContent=d.footer;const a=d.appearance||{};document.documentElement.style.setProperty('--text',a.textColor||'#3f2a1e');document.documentElement.style.setProperty('--button',a.buttonColor||'#fffaf4');document.documentElement.style.setProperty('--button-alpha',(a.buttonOpacity??92)/100);document.documentElement.style.setProperty('--radius',(a.buttonRadius??16)+'px');document.documentElement.style.setProperty('--overlay',(a.overlay??12)/100);document.documentElement.style.setProperty('--title-size',(a.titleSize??36)+'px');document.documentElement.style.setProperty('--body-size',(a.bodySize??15)+'px');links.innerHTML=(d.hasPdf?[`<a class="featured" href="/presentacion" target="_blank"><b>Presentación</b><small>Predicación de esta semana</small></a>`]:[]).concat(d.links.filter(x=>x.active).map(x=>`<a class="${x.featured?'featured':''}" href="${x.url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener"><b>${x.name}</b>${x.description?`<small>${x.description}</small>`:''}</a>`)).join('')}).catch(console.error);
window.addEventListener('message',e=>{if(e.data?.type==='preview'){const d=e.data,a=d.appearance||{};document.title=d.title;title.textContent=d.title;description.textContent=d.description;footer.textContent=d.footer;document.documentElement.style.setProperty('--text',a.textColor);document.documentElement.style.setProperty('--button',a.buttonColor);document.documentElement.style.setProperty('--button-alpha',(a.buttonOpacity??92)/100);document.documentElement.style.setProperty('--radius',(a.buttonRadius??16)+'px');document.documentElement.style.setProperty('--overlay',(a.overlay??12)/100);document.documentElement.style.setProperty('--title-size',(a.titleSize??36)+'px');document.documentElement.style.setProperty('--body-size',(a.bodySize??15)+'px')}});</script></body></html>
